<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mechanistic Mind Observer — Acanthostega Beta 4.0</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem('mm.observer.theme') || 'system';
          var light = window.matchMedia('(prefers-color-scheme: light)').matches;
          var r = p === 'light' ? 'light' : p === 'dark' ? 'dark' : (light ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.setAttribute('data-theme-pref', p);
          document.documentElement.style.colorScheme = r;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
