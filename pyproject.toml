[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanistic-mind"
version = "0.5.4"
description = "Mechanistic Mind 1.0 — Tiktaalik (Beta 1). Primary interface: Psy Observer Web."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Beta 1 public entry is Psy Observer Web launchers / python -m mechanistic_mind.ui.psy_observer_web
# Legacy tkinter Observer is not registered as a gui-script in this release.

[project.optional-dependencies]
observer = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "numpy>=1.26",
  "pydantic>=2.0",
  "httpx>=0.27",
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["mechanistic_mind*"]
